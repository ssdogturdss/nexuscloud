# ─────────────────────────────────────────────────────────────────────────────
# NexusCloud — Docker Compose development/production stack
#
# Usage:
#   cp .env.example .env   # fill in SESSION_SECRET, PANEL_PASSWORD, etc.
#   docker compose up --build
#
# The api service automatically waits for Postgres to be ready before starting.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuscloud
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on localhost only so the DB is not reachable from the internet
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuscloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Override DATABASE_URL to point at the compose db service
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nexuscloud
      SESSION_SECRET: ${SESSION_SECRET}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AGENT_URL: ${AGENT_URL:-}
      AGENT_SECRET: ${AGENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  postgres_data:
